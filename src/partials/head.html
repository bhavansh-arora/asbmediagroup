<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{desc}}">
  <link rel="canonical" href="{{canonical}}">
  <meta name="theme-color" content="#f2ede4">
  <!-- Link previews (WhatsApp, iMessage, Facebook, LinkedIn, Slack, X...): absolute URLs on the live
       domain (from CNAME) and a 1200x630 JPG (make_og.py) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ASB Media Group">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{desc}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{og}}">
  <meta property="og:image:secure_url" content="{{og}}">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{title}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{desc}}">
  <meta name="twitter:image" content="{{og}}">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <!-- Opening state, decided before anything paints. First visit: loader (its two film reels are
       preloaded at high priority right here). Page change: curtain. Safety net: whatever happens to the
       network or scripts, the page is revealed after 9s. -->
  <script>(function(d){d.classList.add("js");setTimeout(function(){if(d.classList.contains("is-in"))return;var l=document.querySelector(".ld");if(l)l.classList.add("is-out");d.classList.add("is-in");setTimeout(function(){d.classList.remove("ld-on","curtain-in")},1300)},9000);try{if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;if(sessionStorage.getItem("asb-curtain"))d.classList.add("curtain-in");else if(!sessionStorage.getItem("asb-seen")){d.classList.add("ld-on","fw");setTimeout(function(){d.classList.remove("fw")},3000);["a","b"].forEach(function(k){var l=document.createElement("link");l.rel="preload";l.as="image";l.href="assets/img/ld-reel-"+k+".webp";l.setAttribute("fetchpriority","high");document.head.appendChild(l)})}}catch(e){}})(document.documentElement)</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://player.vimeo.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300..700;1,300..700&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0;1,9..144,300..700,100&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/css/{{css}}">
  {{headscripts}}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "ASB Media Group",
    "description": "Commercial video production and photography studio in Tampa Bay — brand anthem films, product showcases, social ad campaigns, weddings and sports.",
    "url": "{{site}}/",
    "email": "aramisbooker@asbmediagroup.com",
    "telephone": "+1-813-607-0444",
    "founder": { "@type": "Person", "name": "Aramis Booker" },
    "areaServed": ["Tampa", "St. Petersburg", "Clearwater", "Lakeland", "Sarasota", "Central Florida"],
    "address": { "@type": "PostalAddress", "addressLocality": "Tampa", "addressRegion": "FL", "addressCountry": "US" },
    "image": "{{site}}/assets/img/og/film-funbike.jpg"
  }
  </script>
  {{schema}}
</head>
